name: MAUI Build

# Builds every target framework of the MAUI app (#51, #52, #129).
#
# pr.yaml's per-OS stages filter TFMs through an allowlist of plain framework
# names, so a platform TFM such as net10.0-android is silently skipped there.
# CodeQL's Windows build compiles the Android and Windows TFMs as a side effect,
# but nothing compiled iOS or Mac Catalyst. This workflow builds each platform
# TFM on the OS that can build it, in Release, so warnings are errors
# (Directory.Build.props).
#
# Build-only: no signing, no packaging. iOS builds for the simulator (the SDK
# default for `dotnet build`), which needs no provisioning profile.
#
# Workloads are installed per job rather than cached. The runner's SDK lives in
# a root-owned directory, so caching a workload means moving the SDK to a
# user-writable DOTNET_INSTALL_DIR first; revisit if the install time hurts.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/maui-build.yaml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maui-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  PROJECT: src/Wolfgang.Hawsey.UI.Maui/Wolfgang.Hawsey.UI.Maui.csproj

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android (Linux)
            os: ubuntu-latest
            frameworks: net10.0-android
          - name: Windows
            os: windows-latest
            frameworks: net10.0-windows10.0.19041.0
          - name: iOS + Mac Catalyst (macOS)
            os: macos-latest
            frameworks: net10.0-ios net10.0-maccatalyst
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x

      # The .NET 10 iOS and Mac Catalyst workloads need Xcode 26. The runner image's
      # default Xcode can lag, so select the newest Xcode 26 it has, and fail loudly
      # when there is none rather than failing later with a confusing SDK error.
      - name: Select Xcode
        if: runner.os == 'macOS'
        shell: bash
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 on this runner image. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Selecting $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      # The project's TargetFrameworks depend on the OS (android everywhere, plus
      # windows on Windows and ios / maccatalyst on macOS), and restore evaluates all
      # of them, so let the SDK work out this OS's workloads from the project itself.
      - name: Restore MAUI workloads
        shell: bash
        run: dotnet workload restore "$PROJECT"

      - name: Build
        shell: bash
        env:
          FRAMEWORKS: ${{ matrix.frameworks }}
        run: |
          for tfm in $FRAMEWORKS; do
            echo "::group::Build $tfm"
            dotnet build "$PROJECT" -c Release -f "$tfm"
            echo "::endgroup::"
          done
