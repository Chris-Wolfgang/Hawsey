name: MAUI Build

# Builds every target framework of the MAUI app (#51, #52, #129).
#
# pr.yaml's per-OS stages filter TFMs through an allowlist of plain framework
# names, so a platform TFM such as net10.0-android is silently skipped there.
# CodeQL's Windows build compiles the Android and Windows TFMs as a side effect,
# but nothing compiled iOS or Mac Catalyst. This workflow builds each platform
# TFM on the OS that can build it, in Release, so warnings are errors
# (Directory.Build.props).
#
# Build-only: no signing, no packaging. iOS builds for the simulator (the SDK
# default for `dotnet build`), which needs no provisioning profile.
#
# Workloads are installed per job rather than cached. The runner's SDK lives in
# a root-owned directory, so caching a workload means moving the SDK to a
# user-writable DOTNET_INSTALL_DIR first; revisit if the install time hurts.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/maui-build.yaml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maui-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  PROJECT: src/Wolfgang.Hawsey.UI.Maui/Wolfgang.Hawsey.UI.Maui.csproj

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android (Linux)
            os: ubuntu-latest
            frameworks: net10.0-android
          - name: Windows
            os: windows-latest
            frameworks: net10.0-windows10.0.19041.0
          - name: iOS + Mac Catalyst (macOS)
            os: macos-latest
            frameworks: net10.0-ios net10.0-maccatalyst
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x

      # The project's TargetFrameworks depend on the OS (android everywhere, plus
      # windows on Windows and ios / maccatalyst on macOS), and restore evaluates all
      # of them, so let the SDK work out this OS's workloads from the project itself.
      - name: Restore MAUI workloads
        shell: bash
        run: dotnet workload restore "$PROJECT"

      # Each iOS / Mac Catalyst workload pack is built against one Xcode major.minor
      # (the suffix of Microsoft.iOS.Ref.net10.0_<xcode>), and the runner image's
      # default or newest Xcode is often a different one. Select the Xcode that
      # matches the pack the build will use, and fail loudly when the image lacks
      # it rather than failing later with an SDK error.
      #
      # Read the Ref pack, not the Sdk pack: the workload installs Sdk packs for
      # several Xcode versions side by side, including previews (for example
      # net10.0_27.0 "-xcode27.0"), but only the Ref pack for the default one.
      - name: Select the Xcode the iOS workload was built for
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          packs=("$DOTNET_ROOT"/packs/Microsoft.iOS.Ref.net10.0_*)
          if [ ${#packs[@]} -eq 0 ]; then
            echo "::error::No Microsoft.iOS.Ref pack under $DOTNET_ROOT/packs after workload restore."
            exit 1
          fi
          pack=$(printf '%s\n' "${packs[@]}" | sort -V | tail -1)
          want=${pack##*_}
          echo "iOS workload pack: $pack (Xcode $want)"
          # Xcode_26.5.app or a point release such as Xcode_26.5.1.app.
          candidates=(/Applications/Xcode_"$want"*.app)
          if [ ${#candidates[@]} -eq 0 ]; then
            echo "::error::The runner image has no Xcode $want. Installed:"
            printf '%s\n' /Applications/Xcode*.app
            exit 1
          fi
          xcode=$(printf '%s\n' "${candidates[@]}" | sort -V | tail -1)
          echo "Selecting $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Build
        shell: bash
        env:
          FRAMEWORKS: ${{ matrix.frameworks }}
        run: |
          for tfm in $FRAMEWORKS; do
            echo "::group::Build $tfm"
            dotnet build "$PROJECT" -c Release -f "$tfm"
            echo "::endgroup::"
          done
