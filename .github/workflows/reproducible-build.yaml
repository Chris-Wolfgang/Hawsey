name: Reproducible Build

# Build-reproducibility verification (#82; consumer guide: docs/REPRODUCIBLE-BUILD.md).
#
# Builds the engine from the same commit on Linux and on Windows, then compares
# SHA-256 of every assembly (.dll) and portable PDB (.pdb). CI builds set
# ContinuousIntegrationBuild (GitHub exports CI=true), which with Deterministic
# normalises source paths to /_/, so the two sets must be byte-identical. A
# divergence fails the job and prints exactly which files differ.
#
# The .nupkg is deliberately NOT compared: NuGet writes per-pack zip metadata, so
# two packs of identical assemblies hash differently (verified locally). The
# published contract is the assembly hashes in reproducible-build-manifest.json.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducible-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build the engine (Release, CI)
        shell: bash
        run: dotnet build src/Wolfgang.Hawsey.Engine/Wolfgang.Hawsey.Engine.csproj -c Release

      - name: Hash assemblies and PDBs
        shell: bash
        run: |
          cd src/Wolfgang.Hawsey.Engine/bin/Release
          dotnet --version > "$GITHUB_WORKSPACE/sdk-${{ matrix.os }}.txt"
          find . -type f \( -name 'Wolfgang.Hawsey.Engine.dll' -o -name 'Wolfgang.Hawsey.Engine.pdb' \) \
            | LC_ALL=C sort \
            | while read -r f; do
                if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi
              done \
            | sed 's/ \*/  /' > "$GITHUB_WORKSPACE/hashes-${{ matrix.os }}.txt"
          cat "$GITHUB_WORKSPACE/hashes-${{ matrix.os }}.txt"

      - name: Upload hashes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: hashes-${{ matrix.os }}
          path: |
            hashes-${{ matrix.os }}.txt
            sdk-${{ matrix.os }}.txt

  compare:
    name: Compare Linux vs Windows
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download hashes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: hashes-*
          merge-multiple: true

      - name: Diff
        run: |
          echo "SDK (linux):   $(cat sdk-ubuntu-latest.txt)"
          echo "SDK (windows): $(cat sdk-windows-latest.txt)"
          if ! cmp -s sdk-ubuntu-latest.txt sdk-windows-latest.txt; then
            echo "::warning::The runners resolved different SDKs; hashes are only comparable for the same compiler."
          fi
          if diff -u hashes-ubuntu-latest.txt hashes-windows-latest.txt; then
            echo "✅ $(wc -l < hashes-ubuntu-latest.txt) assemblies/PDBs are byte-identical across Linux and Windows."
          else
            echo "::error::Build is not reproducible: the files above differ between Linux and Windows."
            exit 1
          fi
