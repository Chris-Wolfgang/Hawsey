name: Reproducible Build

# Build-reproducibility verification (#82; consumer guide: docs/REPRODUCIBLE-BUILD.md).
#
# Builds the engine twice per OS - on separate runners, in different checkout
# paths - and requires the SHA-256 of every assembly (.dll) and portable PDB
# (.pdb) to be byte-identical within each OS. CI builds set
# ContinuousIntegrationBuild (GitHub exports CI=true), which with Deterministic
# normalises source paths to /_/, so machine and path must not matter.
#
# Why per OS and not Linux vs Windows: MSBuild writes the sources it generates
# (AssemblyInfo.cs, GlobalUsings.g.cs, the TFM attributes file) with the OS
# newline - CRLF on Windows, LF elsewhere. Their checksums are recorded in the
# PDB and the DLL embeds the PDB id, so one commit legitimately yields different
# bytes on the two OSes (verified: identical paths and IL, only those checksums
# differ). Releases are built on windows-latest, so Windows is the reference a
# third party rebuilds on; Linux is checked too so a regression shows on either.
#
# The .nupkg is deliberately NOT compared: NuGet writes per-pack zip metadata, so
# two packs of identical assemblies hash differently. The published contract is
# the assembly hashes in the release's reproducible-build manifest.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducible-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.copy }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        copy: [a, b]
        include:
          - copy: a
            path: repo
          - copy: b
            path: elsewhere/deeper/checkout
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: ${{ matrix.path }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build the engine (Release, CI)
        working-directory: ${{ matrix.path }}
        run: dotnet build src/Wolfgang.Hawsey.Engine/Wolfgang.Hawsey.Engine.csproj -c Release

      - name: Hash assemblies and PDBs
        env:
          OUT: hashes-${{ matrix.os }}-${{ matrix.copy }}
          CHECKOUT: ${{ matrix.path }}
        run: |
          dotnet --version | tr -d '\r' > "$GITHUB_WORKSPACE/$OUT.sdk"
          cd "$CHECKOUT/src/Wolfgang.Hawsey.Engine/bin/Release"
          find . -type f \( -name 'Wolfgang.Hawsey.Engine.dll' -o -name 'Wolfgang.Hawsey.Engine.pdb' \) \
            | LC_ALL=C sort \
            | while read -r f; do
                if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi
              done \
            | sed 's/ \*/  /' | tr -d '\r' > "$GITHUB_WORKSPACE/$OUT.txt"
          cat "$GITHUB_WORKSPACE/$OUT.txt"

      - name: Upload hashes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: hashes-${{ matrix.os }}-${{ matrix.copy }}
          path: |
            hashes-${{ matrix.os }}-${{ matrix.copy }}.txt
            hashes-${{ matrix.os }}-${{ matrix.copy }}.sdk

      # The binaries themselves, so a divergence can be diagnosed (diff the PDB
      # documents / IL) instead of only detected.
      - name: Upload assemblies and PDBs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.copy }}
          path: |
            ${{ matrix.path }}/src/Wolfgang.Hawsey.Engine/bin/Release/*/Wolfgang.Hawsey.Engine.dll
            ${{ matrix.path }}/src/Wolfgang.Hawsey.Engine/bin/Release/*/Wolfgang.Hawsey.Engine.pdb
          retention-days: 7

  compare:
    name: Compare independent builds
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download hashes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: hashes-*
          merge-multiple: true

      - name: Diff within each OS
        run: |
          status=0
          for os in windows-latest ubuntu-latest; do
            a="hashes-$os-a"; b="hashes-$os-b"
            echo "== $os: SDK $(cat "$a.sdk") vs $(cat "$b.sdk")"
            if ! cmp -s "$a.sdk" "$b.sdk"; then
              echo "::warning::$os runners resolved different SDKs; their hashes are only comparable for the same compiler."
            fi
            if diff -u "$a.txt" "$b.txt"; then
              echo "✅ $os: $(wc -l < "$a.txt") assemblies/PDBs byte-identical across two runners and checkout paths."
            else
              echo "::error::$os: the build is not reproducible - the files above differ between two independent builds."
              status=1
            fi
          done
          exit $status
