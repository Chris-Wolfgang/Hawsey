name: Coyote (concurrency)

# Scheduled systematic-concurrency testing of the engine's GameSession (#73, #834).
#
# tests/Wolfgang.Hawsey.UI.Maui.Tests.Concurrency holds Coyote tests: after build,
# `dotnet coyote rewrite` instruments the assembly so Coyote controls every task
# interleaving, and any interleaving that throws or breaks an invariant is a bug
# with a reproducible schedule. PR runs use 200 iterations per test; here:
#   - weekly: 10,000 iterations per test
#   - monthly soak: 1,000,000 iterations per test, capped at five hours
# HAWSEY_COYOTE_ITERATIONS drives the count. A failed scheduled run uploads the
# test log (with Coyote's bug report) and opens an issue saying what happened: a
# bug only when a test failed (a failed result in the TRX); otherwise that the
# run failed without a test failure (setup, build, timeout, crash or a lost
# runner), which is not evidence of a bug (#943).

on:
  schedule:
    - cron: '0 3 * * 2'   # weekly, Tuesdays 03:00 UTC
    - cron: '0 1 1 * *'   # monthly soak, 1st of the month 01:00 UTC
  workflow_dispatch:
    inputs:
      iterations:
        description: Coyote iterations per test
        required: false
        default: '10000'

permissions:
  contents: read

concurrency:
  group: coyote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coyote:
    name: Coyote systematic tests
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      # "true" only when the test results record a failed test: Coyote's bug
      # report. Unset for every other failure.
      test-failed: ${{ steps.run.outputs.test-failed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Pick the iteration budget
        id: budget
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT: ${{ inputs.iterations }}
        run: |
          if [ "$SCHEDULE" = "0 1 1 * *" ]; then n=1000000; else n="${INPUT:-10000}"; fi
          echo "iterations=$n" >> "$GITHUB_OUTPUT"
          echo "Coyote iterations per test: $n"

      - name: Restore tools (dotnet coyote)
        run: dotnet tool restore

      # Built here, so a restore or build failure fails this step, not the tests.
      - name: Build the Coyote tests
        run: dotnet build tests/Wolfgang.Hawsey.UI.Maui.Tests.Concurrency/Wolfgang.Hawsey.UI.Maui.Tests.Concurrency.csproj -c Release

      - name: Run Coyote tests
        id: run
        env:
          HAWSEY_COYOTE_ITERATIONS: ${{ steps.budget.outputs.iterations }}
        run: |
          set -o pipefail
          mkdir -p coyote-results
          status=0
          timeout 300m dotnet test tests/Wolfgang.Hawsey.UI.Maui.Tests.Concurrency/Wolfgang.Hawsey.UI.Maui.Tests.Concurrency.csproj \
            -c Release --no-build \
            --logger "trx;LogFileName=coyote.trx" --results-directory coyote-results \
            2>&1 | tee coyote-results/coyote.log || status=$?
          # A bug is a test the results record as failed. A timeout, a test-host
          # crash or a logging failure fails the step without one.
          if grep -qs '<UnitTestResult[^>]*outcome="Failed"' coyote-results/coyote.trx; then
            echo "test-failed=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coyote-results
          path: coyote-results/
          retention-days: 30

  report:
    name: File an issue for a Coyote bug
    needs: coyote
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        # One open issue per failure stream: a repeat failure comments on it
        # instead of opening a new issue on every scheduled run. A failed test and
        # any other failure are separate streams, with separate titles.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_FAILED: ${{ needs.coyote.outputs.test-failed }}
        run: |
          if [ "$TEST_FAILED" = "true" ]; then
            export TITLE="Coyote: a concurrency bug was found in GameSession"
            label=bug
            body="The scheduled Coyote run failed: $RUN_URL

          Download the \`coyote-results\` artifact. \`coyote.log\` has Coyote's bug report and the failing schedule. Fix the race, and keep the scenario as a test in \`tests/Wolfgang.Hawsey.UI.Maui.Tests.Concurrency\`."
          else
            export TITLE="Coyote: the scheduled run failed without a test failure"
            label=maintenance
            body="The scheduled Coyote run failed, but no test recorded a failure: $RUN_URL

          So Coyote produced no bug report, and this is not evidence of a concurrency bug. The run's log shows which step failed and why (#943 was a soak that ran out of runner memory)."
          fi
          existing=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
                       --jq '.[] | select(.title == env.TITLE) | .number' | head -1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "Happened again: $RUN_URL"
            exit 0
          fi
          gh issue create --repo "$REPO" --title "$TITLE" --label "$label" --body "$body"
