name: Coyote (concurrency)

# Scheduled systematic-concurrency testing of the engine's GameSession (#73, #834).
#
# tests/Wolfgang.Hawsey.UI.Maui.Tests.Concurrency holds Coyote tests: after build,
# `dotnet coyote rewrite` instruments the assembly so Coyote controls every task
# interleaving, and any interleaving that throws or breaks an invariant is a bug
# with a reproducible schedule. PR runs use 200 iterations per test; here:
#   - weekly: 10,000 iterations per test
#   - monthly soak: 1,000,000 iterations per test, capped at five hours
# HAWSEY_COYOTE_ITERATIONS drives the count. A failed scheduled run uploads the
# test log (with Coyote's bug report) and opens an issue saying what happened: a
# bug only when the tests ran to the end and failed; otherwise that the run did
# not finish (the timeout hit or the runner was lost), which is not evidence of a
# bug (#943).

on:
  schedule:
    - cron: '0 3 * * 2'   # weekly, Tuesdays 03:00 UTC
    - cron: '0 1 1 * *'   # monthly soak, 1st of the month 01:00 UTC
  workflow_dispatch:
    inputs:
      iterations:
        description: Coyote iterations per test
        required: false
        default: '10000'

permissions:
  contents: read

concurrency:
  group: coyote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coyote:
    name: Coyote systematic tests
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      # "true" once the tests ran to the end, passed or failed. Unset when the
      # timeout or a lost runner stopped them first.
      finished: ${{ steps.run.outputs.finished }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Pick the iteration budget
        id: budget
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT: ${{ inputs.iterations }}
        run: |
          if [ "$SCHEDULE" = "0 1 1 * *" ]; then n=1000000; else n="${INPUT:-10000}"; fi
          echo "iterations=$n" >> "$GITHUB_OUTPUT"
          echo "Coyote iterations per test: $n"

      - name: Restore tools (dotnet coyote)
        run: dotnet tool restore

      - name: Run Coyote tests
        id: run
        env:
          HAWSEY_COYOTE_ITERATIONS: ${{ steps.budget.outputs.iterations }}
        run: |
          set -o pipefail
          mkdir -p coyote-results
          status=0
          timeout 300m dotnet test tests/Wolfgang.Hawsey.UI.Maui.Tests.Concurrency/Wolfgang.Hawsey.UI.Maui.Tests.Concurrency.csproj \
            -c Release \
            --logger "trx;LogFileName=coyote.trx" --results-directory coyote-results \
            2>&1 | tee coyote-results/coyote.log || status=$?
          # 124: `timeout` stopped the tests. Any other status means they ran to the end.
          if [ "$status" -ne 124 ]; then
            echo "finished=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coyote-results
          path: coyote-results/
          retention-days: 30

  report:
    name: File an issue for a Coyote bug
    needs: coyote
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        # One open issue per failure stream: a repeat failure comments on it
        # instead of opening a new issue on every scheduled run. A bug and a run
        # that did not finish are separate streams, with separate titles.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FINISHED: ${{ needs.coyote.outputs.finished }}
        run: |
          if [ "$FINISHED" = "true" ]; then
            export TITLE="Coyote: a concurrency bug was found in GameSession"
            label=bug
            body="The scheduled Coyote run failed: $RUN_URL

          Download the \`coyote-results\` artifact. \`coyote.log\` has Coyote's bug report and the failing schedule. Fix the race, and keep the scenario as a test in \`tests/Wolfgang.Hawsey.UI.Maui.Tests.Concurrency\`."
          else
            export TITLE="Coyote: the scheduled run did not finish"
            label=maintenance
            body="The scheduled Coyote run stopped before its tests finished: $RUN_URL

          The 300-minute timeout or a lost runner ended it, so Coyote produced no bug report, and this is not evidence of a concurrency bug. Check where the run's log stops, and whether the iteration budget still fits the runner's time and memory (#943)."
          fi
          existing=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
                       --jq '.[] | select(.title == env.TITLE) | .number' | head -1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "Happened again: $RUN_URL"
            exit 0
          fi
          gh issue create --repo "$REPO" --title "$TITLE" --label "$label" --body "$body"
