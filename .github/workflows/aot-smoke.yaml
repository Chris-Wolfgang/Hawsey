name: AOT Smoke

# Native AOT / trimming verification for the engine (issue #79).
#
# The engine sets IsAotCompatible + IsTrimmable, and .editorconfig raises the
# ILLink trim / AOT / single-file analyzers to warning, so the Release build
# already fails on a trim-unsafe pattern. This workflow closes the other half:
# it publishes a real consumer (examples/Wolfgang.Hawsey.Engine.AotSmoke) with
# PublishAot, which trims and AOT-compiles the engine, and then RUNS the native
# binary through complete games. A trim that silently drops something the
# engine needs shows up here as a crash or a non-zero exit, before merge.
#
# Linux only: Native AOT needs the platform linker (clang on ubuntu-latest);
# Windows runners and dev boxes need the VS C++ tools, which are not assumed.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aot-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aot-smoke:
    name: Publish + run Native AOT consumer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x

      # PublishAot comes from the consumer's .csproj on purpose, never from the command
      # line: a -p: global property flows into every referenced project, and the
      # engine's netstandard2.0 slot cannot be AOT-compiled (NETSDK1207).
      - name: Publish (Native AOT, linux-x64)
        run: >
          dotnet publish examples/Wolfgang.Hawsey.Engine.AotSmoke/Wolfgang.Hawsey.Engine.AotSmoke.csproj
          -c Release -r linux-x64 -o aot-out
          -warnaserror

      - name: Confirm the output is a native binary
        run: |
          file aot-out/Wolfgang.Hawsey.Engine.AotSmoke
          file aot-out/Wolfgang.Hawsey.Engine.AotSmoke | grep -q 'ELF 64-bit'
          if [ -f aot-out/Wolfgang.Hawsey.Engine.AotSmoke.dll ]; then
            echo "::error::A managed Wolfgang.Hawsey.Engine.AotSmoke.dll was published - this is not a Native AOT build."
            exit 1
          fi

      - name: Run the native binary
        run: ./aot-out/Wolfgang.Hawsey.Engine.AotSmoke
