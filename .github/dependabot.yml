version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      dotnet-dependencies:
        patterns:
          - "*"

  # Keep third-party GitHub Actions pinned in workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

  # Keep the hash-pinned pip tooling (zizmor, semgrep) under .github/requirements
  # up to date. Without this the --require-hashes pins never move, leaving both
  # tools frozen at whatever version was current when they were pinned;
  # Dependabot regenerates the hashes along with the versions.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # semgrep.txt is compiled with semgrep-overrides.txt, which lifts these past the
    # pins in semgrep's own metadata. Dependabot can't apply overrides, so updating them
    # fails with dependency_file_not_resolvable. Update them by running the uv command
    # in semgrep.txt's header.
    ignore:
      - dependency-name: "semgrep"
      - dependency-name: "mcp"
      - dependency-name: "opentelemetry-*"
    labels:
      - "dependencies"
    groups:
      pip-tooling:
        patterns:
          - "*"
